<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo Space</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <form id="authForm" class="auth-card">
      <p class="mark">M</p><h1>Memo Space</h1><p>생각을 기록하고 함께 완성하세요.</p>
      <label>이메일<input id="emailInput" type="email" required autocomplete="email" /></label>
      <label>비밀번호<input id="passwordInput" type="password" required minlength="6" autocomplete="current-password" /></label>
      <p id="authMessage" class="message"></p>
      <button type="submit" class="primary">로그인</button>
      <button id="signUpButton" type="button" class="text-button">처음이신가요? 회원가입</button>
    </form>
  </div>

  <main id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span>M</span><strong>Memo Space</strong></div>
      <button id="newMemoButton" class="new-memo" type="button">+ 새 메모</button>
      <nav class="nav" aria-label="메모 메뉴">
        <button class="nav-item active" data-view="all">전체 메모</button>
        <button class="nav-item" data-view="pinned">고정됨</button>
        <button class="nav-item" data-view="archive">보관됨</button>
        <button class="nav-item" data-view="trash">휴지통</button>
      </nav>
      <section class="side-section"><div><b>폴더</b><button id="addFolderButton" type="button" aria-label="폴더 추가">+</button></div><div id="folderList"></div></section>
      <section class="side-section"><div><b>워크스페이스</b><button id="addWorkspaceButton" type="button" aria-label="워크스페이스 추가">+</button></div><div id="workspaceList"></div></section>
      <div class="account"><span id="userEmail"></span><button id="signOutButton" type="button">로그아웃</button></div>
    </aside>
    <section class="content">
      <header class="topbar"><div><p id="viewCaption">내 메모</p><h1 id="viewTitle">전체 메모</h1></div><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="메모 검색" /></label></header>
      <div class="filters"><button id="clearFilterButton" type="button" hidden>필터 지우기</button><p id="statusMessage" class="message"></p></div>
      <section id="memoList" class="memo-grid" aria-live="polite"></section>
    </section>
  </main>

  <dialog id="memoDialog" class="dialog memo-dialog"><form id="memoForm" method="dialog">
    <header><h2 id="memoDialogTitle">새 메모</h2><button class="icon-button" value="cancel" type="submit" aria-label="닫기">×</button></header>
    <input id="memoTitleInput" maxlength="200" placeholder="제목 없음" aria-label="메모 제목" />
    <textarea id="memoBodyInput" placeholder="내용을 입력하세요." aria-label="메모 내용"></textarea>
    <div class="form-row"><label>폴더<select id="folderSelect"><option value="">폴더 없음</option></select></label><label>워크스페이스<select id="workspaceSelect"><option value="">개인 메모</option></select></label></div>
    <label>태그 <input id="tagInput" placeholder="쉼표로 구분 (예: 업무, 아이디어)" /></label>
    <div class="dialog-actions"><button id="trashButton" type="button" class="text-button" hidden>휴지통으로</button><button id="archiveButton" type="button" class="secondary" hidden>보관</button><button id="pinButton" type="button" class="secondary">☆ 고정</button><button id="saveMemoButton" type="button" class="primary">저장</button></div>
    <section id="shareSection" hidden><hr/><h3>공유</h3><div class="share-row"><input id="shareEmailInput" type="email" placeholder="초대할 사람의 가입 이메일" /><select id="shareRoleSelect"><option value="viewer">보기</option><option value="editor">편집</option><option value="admin">관리</option></select><button id="shareButton" type="button" class="secondary">초대</button></div><p id="shareMessage" class="message"></p></section>
    <section id="commentsSection" hidden><hr/><h3>댓글</h3><div id="commentList"></div><div class="comment-form"><input id="commentInput" maxlength="2000" placeholder="의견을 남겨보세요" /><button id="commentButton" type="button" class="secondary">등록</button></div></section>
    <section id="historySection" hidden><hr/><h3>변경 이력</h3><div id="historyList"></div></section>
  </form></dialog>
  <dialog id="simpleDialog" class="dialog simple-dialog"><form id="simpleForm" method="dialog"><header><h2 id="simpleTitle"></h2><button class="icon-button" value="cancel" type="submit">×</button></header><label id="simpleLabel">이름<input id="simpleInput" required maxlength="100" /></label><div class="dialog-actions"><button value="cancel" type="submit" class="secondary">취소</button><button id="simpleSaveButton" value="default" type="submit" class="primary">만들기</button></div></form></dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="app.js"></script>
</body></html>
